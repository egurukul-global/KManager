<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneKailasa Real Styles Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Import the real global stylesheet -->
  <link rel="stylesheet" href="src/styles.css">

  <style>
    /* Add only our test overrides here to isolate and test them against the real CSS classes */
    
    /* 1. Global Ambient Glows (z-index: 0) */
    .ok-glow {
      pointer-events: none;
      border-radius: 50%;
      position: absolute;
      z-index: 0;
      opacity: 0.85;
      transition: all 0.3s ease;
    }
    
    .ok-glow-1 {
      top: 5%;
      left: 10%;
      width: 320px;
      height: 320px;
      background: rgba(255, 165, 0, 0.35);
      filter: blur(90px);
    }
    
    .ok-glow-2 {
      top: 35%;
      right: 8%;
      width: 350px;
      height: 350px;
      background: rgba(212, 175, 55, 0.25);
      filter: blur(100px);
    }

    .ok-glow-3 {
      bottom: 5%;
      left: 12%;
      width: 300px;
      height: 300px;
      background: rgba(255, 165, 0, 0.22);
      filter: blur(80px);
    }

    /* Make sure the main layout wraps glows correctly and doesn't scroll horizontally */
    body {
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s ease;
    }

    /* Apply radial gradients to body directly so it serves as the canvas behind glass panels */
    body.dark {
      background: radial-gradient(circle at 50% 20%, #8B0000 0%, #3a0008 100%) !important;
    }
    body:not(.dark) {
      background: radial-gradient(circle at 50% 20%, #FAF4EC 0%, #F3E5D8 100%) !important;
    }

    /* Make the core container background transparent so gradient shows through */
    .main-area {
      background: transparent !important;
      position: relative;
      z-index: 1;
    }

    /* Ensure z-index layering for sidebars & topbars */
    .sidebar {
      z-index: 1000;
      position: fixed;
    }
    .app-topbar {
      z-index: 100;
      position: sticky;
      top: 0;
    }

    /* Specific overrides to prevent conflicts with real styles.css */
    
    /* Light Theme Glass Sidebar overrides */
    body:not(.dark) .sidebar.glass-sidebar {
      background: rgba(255, 255, 255, 0.65) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border-right: 1px solid rgba(255, 165, 0, 0.35) !important;
    }
    body:not(.dark) .sidebar.glass-sidebar .sidebar-item {
      color: var(--text) !important;
    }
    body:not(.dark) .sidebar.glass-sidebar .sidebar-item:hover,
    body:not(.dark) .sidebar.glass-sidebar .sidebar-item.active {
      background: rgba(139, 0, 0, 0.05) !important;
      color: var(--dp-accent-red) !important;
    }

    /* Dark Theme Glass Sidebar overrides */
    body.dark .sidebar.glass-sidebar {
      background: rgba(25, 0, 5, 0.45) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border-right: 1px solid rgba(212, 175, 55, 0.3) !important;
    }

    /* Glass Topbar overrides */
    body.dark .app-topbar.glass-topbar {
      background: rgba(20, 0, 4, 0.45) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3) !important;
    }
    body:not(.dark) .app-topbar.glass-topbar {
      background: rgba(255, 255, 255, 0.65) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border-bottom: 1px solid rgba(255, 165, 0, 0.35) !important;
    }

    /* Test buttons */
    .theme-toggle-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      z-index: 2000;
      border: 1px solid rgba(0,0,0,0.1);
    }
  </style>
</head>
<body class="dark">

  <button class="theme-toggle-btn" onclick="toggleTheme()">Toggle Dark/Light Mode</button>

  <!-- Global Ambient Glowing Spheres (z-index: 0) -->
  <div class="ok-glow ok-glow-1"></div>
  <div class="ok-glow ok-glow-2"></div>
  <div class="ok-glow ok-glow-3"></div>

  <!-- Mobile header (z-index: 999) -->
  <div class="mobile-header">
    <button type="button" class="menu-toggle" onclick="toggleSidebar()">☰</button>
    <h1 style="flex: 1; text-align: center; font-size: 1.1rem; font-weight: 700; margin: 0;">OneKailasa</h1>
    <div style="width: 32px; height: 32px; border-radius: 50%; background: #9a4452; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 0.8rem;">U</div>
  </div>

  <div class="overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- The Real App Shell Layout Structure -->
  <div class="app-shell active">
    
    <!-- Sidebar -->
    <aside class="sidebar glass-sidebar" id="sidebar">
      <div style="display: flex; align-items: center; gap: 12px; padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.08);">
        <div style="width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.25rem;">OK</div>
        <div>
          <h1 style="font-size: 1.1rem; font-weight: 700; margin: 0; line-height: 1.2;">OneKailasa</h1>
          <p style="font-size: 0.75rem; opacity: 0.7; margin: 0;">Monastery Operations</p>
        </div>
      </div>

      <nav class="nav-menu" style="flex: 1; padding: 15px 0; display: flex; flex-direction: column; gap: 4px;">
        <div class="sidebar-item active">
          <i class="fa-solid fa-house" style="width: 18px; text-align: center;"></i>
          <span>Home</span>
        </div>
        <div class="sidebar-item">
          <i class="fa-solid fa-list-check" style="width: 18px; text-align: center;"></i>
          <span>Tasks</span>
        </div>
        <div class="sidebar-item">
          <i class="fa-solid fa-comments" style="width: 18px; text-align: center;"></i>
          <span>Konnect</span>
        </div>
      </nav>
    </aside>

    <!-- Main Area -->
    <div class="main-area">
      <!-- Topbar Header -->
      <header class="app-topbar glass-topbar">
        <div>
          <h2 class="topbar-title">Dashboard Overview</h2>
        </div>
        <div class="topbar-actions">
          <div class="search-box">
            <i class="fa-solid fa-search" style="opacity: 0.7; font-size: 0.85rem;"></i>
            <input type="text" class="search-input" placeholder="Search operations...">
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <main class="main-content">
        <!-- 12-Column Responsive Layout of Cards -->
        <div style="display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px;">
          
          <!-- Spanning Cards -->
          <div class="glass-panel-dark col-4" id="card1" style="padding: 24px; border-radius: 16px;">
            <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 12px;">👥 Active Members</h3>
            <div style="font-size: 2.2rem; font-weight: 800;">128</div>
          </div>

          <div class="glass-panel-dark col-4" id="card2" style="padding: 24px; border-radius: 16px;">
            <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 12px;">⏱️ Running Budgets</h3>
            <div style="font-size: 2.2rem; font-weight: 800;">42</div>
          </div>

          <div class="glass-panel-dark col-4" id="card3" style="padding: 24px; border-radius: 16px;">
            <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 12px;">📝 Open Clearances</h3>
            <div style="font-size: 2.2rem; font-weight: 800;">7</div>
          </div>

        </div>
      </main>
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button type="button" class="bottom-nav-item active">
      <span>🏠</span>
      <span>Home</span>
    </button>
    <button type="button" class="bottom-nav-item">
      <span>👤</span>
      <span>Profile</span>
    </button>
  </nav>

  <script>
    function toggleTheme() {
      const body = document.body;
      const card1 = document.getElementById('card1');
      const card2 = document.getElementById('card2');
      const card3 = document.getElementById('card3');
      
      if (body.classList.contains('dark')) {
        body.classList.remove('dark');
        [card1, card2, card3].forEach(c => {
          c.classList.remove('glass-panel-dark');
          c.classList.add('glass-panel-light');
        });
      } else {
        body.classList.add('dark');
        [card1, card2, card3].forEach(c => {
          c.classList.remove('glass-panel-light');
          c.classList.add('glass-panel-dark');
        });
      }
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
    }
  </script>
</body>
</html>
