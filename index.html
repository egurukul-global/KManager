<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#7B3540">
    <title>One Kailasa</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.6/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.6/vfs_fonts.min.js"></script>
    <!-- OpenCV.js: load outside Vite (do not import/bundle). Required by jscanify receipt scanner. -->
    <style>
      #opencvLoadBanner {
        position: fixed;
        z-index: 99999;
        left: 12px;
        right: 12px;
        bottom: 12px;
        max-width: 440px;
        margin: 0 auto;
        padding: 12px 16px;
        border-radius: 10px;
        background: rgba(30, 30, 30, 0.94);
        color: #fff;
        font: 14px/1.45 system-ui, sans-serif;
        box-shadow: 0 4px 20px rgba(0,0,0,0.28);
      }
      #opencvLoadBanner[hidden] { display: none !important; }
      #opencvLoadBanner.is-error { background: rgba(155, 34, 38, 0.96); }
      #opencvLoadBanner.is-ready { background: rgba(45, 106, 79, 0.96); }
      #opencvLoadBanner .opencv-banner-title { font-weight: 600; margin: 0 0 4px; }
      #opencvLoadBanner .opencv-banner-detail { margin: 0; opacity: 0.9; font-size: 13px; }
    </style>
    <script>
      window.__opencvReady = false;
      window.__opencvLoadError = '';
      window.__opencvStatus = 'downloading';
      window.__opencvStartedAt = Date.now();

      function __opencvElapsed() {
        return Math.max(0, Math.round((Date.now() - (window.__opencvStartedAt || Date.now())) / 1000));
      }

      function __setOpenCvBanner(title, detail, mode) {
        var el = document.getElementById('opencvLoadBanner');
        if (!el) return;
        el.hidden = false;
        el.classList.toggle('is-error', mode === 'error');
        el.classList.toggle('is-ready', mode === 'ready');
        var t = el.querySelector('.opencv-banner-title');
        var d = el.querySelector('.opencv-banner-detail');
        if (t) t.textContent = title || '';
        if (d) d.textContent = detail || '';
      }

      function __hideOpenCvBannerSoon() {
        var el = document.getElementById('opencvLoadBanner');
        if (!el) return;
        setTimeout(function () { el.hidden = true; }, 1800);
      }

      function __markOpenCvReady() {
        window.__opencvReady = true;
        window.__opencvStatus = 'ready';
        window.__opencvLoadError = '';
        __setOpenCvBanner(
          'Receipt scanner ready',
          'You can scan receipts on Add Expense.',
          'ready'
        );
        __hideOpenCvBannerSoon();
        try { window.dispatchEvent(new Event('opencv-ready')); } catch (e) {}
      }

      function __onOpenCvScriptLoad() {
        window.__opencvStatus = 'initializing';
        __setOpenCvBanner(
          'Preparing receipt scanner…',
          'OpenCV downloaded. Finishing setup (' + __opencvElapsed() + 's)…',
          'loading'
        );
        if (!window.cv) {
          window.__opencvLoadError = 'OpenCV.js loaded but cv is missing';
          window.__opencvStatus = 'error';
          __setOpenCvBanner('Scanner failed to load', window.__opencvLoadError, 'error');
          return;
        }
        if (window.cv.Mat) {
          __markOpenCvReady();
          return;
        }
        window.cv.onRuntimeInitialized = function () {
          __markOpenCvReady();
        };
      }

      function __onOpenCvScriptError() {
        window.__opencvStatus = 'error';
        window.__opencvLoadError = 'Failed to download OpenCV.js. Check your network / VPN and refresh.';
        __setOpenCvBanner('Scanner failed to load', window.__opencvLoadError, 'error');
      }

      // Keep message alive while downloading / initializing
      setInterval(function () {
        if (window.__opencvReady || window.__opencvStatus === 'error') return;
        var sec = __opencvElapsed();
        if (window.__opencvStatus === 'downloading') {
          __setOpenCvBanner(
            'Downloading receipt scanner…',
            'Please wait — first load can take a while (' + sec + 's). Do not close this page.',
            'loading'
          );
        } else if (window.__opencvStatus === 'initializing') {
          __setOpenCvBanner(
            'Preparing receipt scanner…',
            'Almost ready (' + sec + 's)…',
            'loading'
          );
        }
      }, 1000);

      window.addEventListener('load', function () {
        if (window.__opencvReady) return;
        if (window.__opencvStatus === 'error') return;
        __setOpenCvBanner(
          window.__opencvStatus === 'initializing'
            ? 'Preparing receipt scanner…'
            : 'Still downloading receipt scanner…',
          'Page loaded; scanner engine still working (' + __opencvElapsed() + 's)…',
          'loading'
        );
      });
    </script>
    <script
      src="https://docs.opencv.org/4.7.0/opencv.js"
      async
      onload="__onOpenCvScriptLoad()"
      onerror="__onOpenCvScriptError()"
    ></script>
</head>
<body>
    <div id="opencvLoadBanner" role="status" aria-live="polite">
      <p class="opencv-banner-title">Downloading receipt scanner…</p>
      <p class="opencv-banner-detail">Please wait — first load can take a while. Do not close this page.</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
